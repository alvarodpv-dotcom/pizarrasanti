<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizarra Creativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
        input[type="file"] { display: none; }
        
        #canvas-wrapper::-webkit-scrollbar { width: 12px; height: 12px; }
        #canvas-wrapper::-webkit-scrollbar-track { background: #e5e7eb; border-radius: 8px; }
        #canvas-wrapper::-webkit-scrollbar-thumb { background-color: #9ca3af; border-radius: 8px; border: 3px solid #e5e7eb; }
        
        .canvas-container {
            margin: 20px auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background-color: white;
            transition: all 0.3s ease;
        }

        .tool-btn.active { background-color: #3b82f6; color: white; border-color: #2563eb; }

        #erase-canvas {
            cursor: crosshair;
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 90vw;
            max-height: 70vh;
        }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        #ai-loading {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 200; backdrop-filter: blur(4px);
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #8b5cf6; border-top-color: transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex h-screen flex-col">

    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 sm:px-6 shrink-0 z-10 shadow-sm overflow-x-auto">
        <div class="flex items-center gap-4">
            <h1 class="font-bold text-lg sm:text-xl text-gray-800 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-palette text-blue-500"></i> Pizarra
            </h1>
            
            <div class="h-8 w-px bg-gray-300 mx-1 sm:mx-2"></div>
            
            <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-lg border border-gray-200">
                <button id="btn-undo" onclick="undo()" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-gray-800 hover:bg-gray-200 rounded transition disabled:opacity-30 disabled:cursor-not-allowed" title="Deshacer (Ctrl+Z)">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button id="btn-redo" onclick="redo()" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-gray-800 hover:bg-gray-200 rounded transition disabled:opacity-30 disabled:cursor-not-allowed" title="Rehacer (Ctrl+Y)">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <div class="h-8 w-px bg-gray-300 mx-1 sm:mx-2"></div>
            
            <div class="hidden md:flex items-center gap-2 text-sm text-gray-600">
                <label title="Ancho"><i class="fa-solid fa-arrows-left-right"></i></label>
                <input type="number" id="canvas-width" value="1200" class="w-16 sm:w-20 px-2 py-1 border rounded bg-gray-50 focus:outline-none focus:border-blue-500">
                <span class="text-gray-400">x</span>
                <label title="Alto"><i class="fa-solid fa-arrows-up-down"></i></label>
                <input type="number" id="canvas-height" value="800" class="w-16 sm:w-20 px-2 py-1 border rounded bg-gray-50 focus:outline-none focus:border-blue-500">
                <button onclick="resizeCanvas()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded transition-colors text-xs font-semibold">
                    Aplicar
                </button>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <button onclick="document.getElementById('load-project-input').click()" class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition border border-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-folder-open"></i> <span class="hidden sm:inline">Abrir</span>
            </button>
            <input type="file" id="load-project-input" accept=".json" onchange="loadProject(event)">
            
            <button onclick="saveProject()" class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition border border-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> <span class="hidden sm:inline">Guardar</span>
            </button>
            
            <button onclick="exportImage()" class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-white bg-blue-500 hover:bg-blue-600 rounded-lg transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Exportar PNG</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-16 sm:w-20 bg-white border-r border-gray-200 flex flex-col items-center py-4 sm:py-6 gap-4 sm:gap-6 shrink-0 z-10 shadow-sm overflow-y-auto hide-scroll">
            
            <div class="flex flex-col gap-2 sm:gap-3 w-full px-2 sm:px-3">
                <button id="btn-select" onclick="setTool('select')" class="tool-btn active w-full aspect-square rounded-xl flex flex-col items-center justify-center text-gray-600 hover:bg-gray-100 border-2 border-transparent transition" title="Mover y Rotar (V)">
                    <i class="fa-solid fa-arrow-pointer text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold">Mover</span>
                </button>

                <button id="btn-draw" onclick="setTool('draw')" class="tool-btn w-full aspect-square rounded-xl flex flex-col items-center justify-center text-gray-600 hover:bg-gray-100 border-2 border-transparent transition" title="Lápiz (P)">
                    <i class="fa-solid fa-pen text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold">Lápiz</span>
                </button>

                <button id="btn-bucket" onclick="setTool('bucket')" class="tool-btn w-full aspect-square rounded-xl flex flex-col items-center justify-center text-gray-600 hover:bg-gray-100 border-2 border-transparent transition" title="Pintar Fondo: Toca el lienzo para llenarlo de color">
                    <i class="fa-solid fa-fill-drip text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold">Balde</span>
                </button>

                <button id="btn-eraser" onclick="setTool('eraser')" class="tool-btn w-full aspect-square rounded-xl flex flex-col items-center justify-center text-gray-600 hover:bg-gray-100 border-2 border-transparent transition text-red-500" title="Borrador de Trazos">
                    <i class="fa-solid fa-eraser text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold">Borrar</span>
                </button>
            </div>

            <div class="w-10 sm:w-12 h-px bg-gray-200"></div>

            <div id="drawing-options" class="flex flex-col items-center gap-3 w-full opacity-50 pointer-events-none transition-opacity">
                <input type="color" id="brush-color" value="#000000" class="w-8 h-8 sm:w-10 sm:h-10 rounded cursor-pointer border border-gray-300 p-0" title="Color" onchange="updateBrush()">
                <div class="flex flex-col items-center w-full px-1 sm:px-2">
                    <span id="brush-size-label" class="text-[10px] sm:text-xs text-gray-500 font-bold mb-1">5px</span>
                    <input type="range" id="brush-size" min="1" max="50" value="5" class="w-full accent-blue-500" oninput="updateBrush()">
                </div>
            </div>

            <div class="w-10 sm:w-12 h-px bg-gray-200"></div>

            <div class="flex flex-col gap-2 sm:gap-3 w-full px-2 sm:px-3">
                <button onclick="pasteFromClipboard()" class="w-full aspect-square rounded-xl flex flex-col items-center justify-center text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200 transition" title="Pegar imagen copiada">
                    <i class="fa-solid fa-paste text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold text-center leading-tight">Pegar<br>Imagen</span>
                </button>

                <button onclick="document.getElementById('sticker-upload').click()" class="w-full aspect-square rounded-xl flex flex-col items-center justify-center text-emerald-600 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 transition">
                    <i class="fa-solid fa-images text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold text-center leading-tight">Añadir<br>Sticker</span>
                </button>
                <input type="file" id="sticker-upload" accept="image/*" onchange="addSticker(event)">

                <button onclick="document.getElementById('bg-upload').click()" class="w-full aspect-square rounded-xl flex flex-col items-center justify-center text-purple-600 bg-purple-50 hover:bg-purple-100 border border-purple-200 transition">
                    <i class="fa-regular fa-image text-lg sm:text-xl mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold text-center leading-tight">Fondo<br>Lienzo</span>
                </button>
                <input type="file" id="bg-upload" accept="image/*" onchange="setBackground(event)">
            </div>
            
            <div class="mt-auto w-full px-2 sm:px-3 pb-2">
                <button onclick="clearCanvas()" class="w-full py-2 rounded-lg flex flex-col items-center justify-center text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 transition">
                    <i class="fa-solid fa-trash-can mb-1"></i>
                    <span class="text-[9px] sm:text-[10px] font-semibold">Vaciar</span>
                </button>
            </div>
        </aside>

        <!-- Área principal -->
        <main id="canvas-wrapper" class="flex-1 bg-gray-200 overflow-auto relative flex items-center justify-center p-4 sm:p-8">
            
            <div id="floating-toolbar" class="absolute hidden bg-white rounded-lg shadow-xl border border-gray-200 p-1 flex items-center gap-1 z-50 transition-transform transform hover:scale-105">
                <button onclick="deleteSelected()" class="w-10 h-10 flex items-center justify-center rounded-md text-red-500 hover:bg-red-50 hover:text-red-600 transition" title="Eliminar seleccionado">
                    <i class="fa-solid fa-trash text-lg"></i>
                </button>
                
                <div class="w-px h-6 bg-gray-200 mx-1"></div>
                
                <button onclick="rotateSelected()" class="w-10 h-10 flex items-center justify-center rounded-md text-gray-600 hover:bg-gray-100 transition" title="Girar 90°">
                    <i class="fa-solid fa-rotate-right text-lg"></i>
                </button>
                <button onclick="flipSelected()" class="w-10 h-10 flex items-center justify-center rounded-md text-gray-600 hover:bg-gray-100 transition" title="Efecto Espejo (Voltear)">
                    <i class="fa-solid fa-right-left text-lg"></i>
                </button>
                
                <div id="floating-img-separators" class="w-px h-6 bg-gray-200 mx-1 hidden"></div>
                
                <button id="floating-crop-btn" onclick="openEraseModal('crop')" class="w-10 h-10 flex items-center justify-center rounded-md text-indigo-500 hover:bg-indigo-50 hover:text-indigo-600 transition" title="Recortar bordes de la imagen">
                    <i class="fa-solid fa-crop-simple text-lg"></i>
                </button>
                <button id="floating-edit-btn" onclick="openEraseModal('magic')" class="w-10 h-10 flex items-center justify-center rounded-md text-blue-500 hover:bg-blue-50 hover:text-blue-600 transition" title="Borrar fondo o Editar imagen">
                    <i class="fa-solid fa-scissors text-lg"></i>
                </button>
            </div>

            <canvas id="c"></canvas>
            
        </main>
    </div>

    <!-- MODAL: EDITOR DE IMAGEN -->
    <div id="erase-modal" class="fixed inset-0 bg-black/85 z-[100] hidden flex-col items-center justify-center">
        
        <div id="ai-loading">
            <div class="spinner"></div>
            <p class="font-bold text-xl mb-2 text-purple-300"><i class="fa-solid fa-wand-magic-sparkles"></i> La IA está trabajando...</p>
            <p class="text-sm text-gray-300 text-center px-6 max-w-md">La primera vez puede tardar unos segundos en cargar el cerebro matemático.</p>
        </div>

        <div class="bg-gray-800 w-full p-3 flex flex-col sm:flex-row items-center justify-between shadow-lg gap-3 relative z-10">
            
            <div class="flex bg-gray-900 p-1 rounded-lg border border-gray-700 overflow-x-auto hide-scroll max-w-full shrink-0">
                <button id="tool-crop" onclick="setEraseMode('crop')" class="modal-tool px-3 py-1.5 text-gray-400 hover:text-white rounded-md text-sm font-semibold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-crop-simple"></i> Recortar
                </button>
                <div class="w-px bg-gray-700 mx-1"></div>
                <button id="tool-manual" onclick="setEraseMode('manual')" class="modal-tool px-3 py-1.5 text-gray-400 hover:text-white rounded-md text-sm font-semibold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-eraser"></i> Normal
                </button>
                <button id="tool-smart" onclick="setEraseMode('smart')" class="modal-tool px-3 py-1.5 text-gray-400 hover:text-white rounded-md text-sm font-semibold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-brain"></i> Inteligente
                </button>
                <div class="w-px bg-gray-700 mx-1"></div>
                <button id="tool-ai" onclick="applyAI()" class="px-3 py-1.5 text-purple-400 hover:text-white hover:bg-purple-600 rounded-md text-sm font-bold transition flex items-center gap-2 whitespace-nowrap border border-purple-500 bg-purple-900/30" title="Magia IA: Quita el fondo automáticamente con Inteligencia Artificial">
                    <i class="fa-solid fa-robot"></i> Magia IA
                </button>
                <div class="w-px bg-gray-700 mx-1"></div>
                <button id="tool-restore" onclick="setEraseMode('restore')" class="modal-tool px-3 py-1.5 text-gray-400 hover:text-white rounded-md text-sm font-semibold transition flex items-center gap-2 whitespace-nowrap text-emerald-400 hover:text-emerald-300">
                    <i class="fa-solid fa-bandage"></i> Restaurar
                </button>
            </div>
            
            <div id="erase-options-brush" class="hidden items-center gap-3 bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-600 shrink-0">
                <label class="text-white text-xs font-semibold">Tamaño:</label>
                <input type="range" id="erase-brush-size" min="5" max="100" value="30" class="w-20 sm:w-28 accent-blue-500">
            </div>
            <div id="erase-options-tolerance" class="hidden items-center gap-3 bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-600 shrink-0">
                <label class="text-white text-xs font-semibold">Fuerza:</label>
                <input type="range" id="erase-tolerance" min="1" max="150" value="40" class="w-20 sm:w-28 accent-purple-500">
            </div>
            <div id="erase-options-crop" class="hidden items-center gap-2 text-yellow-300 text-sm font-bold animate-pulse shrink-0">
                <i class="fa-solid fa-arrow-pointer"></i> Arrastra para recortar
            </div>

            <div class="flex items-center gap-2 shrink-0 ml-auto">
                <button onclick="resetEraseCanvas()" class="w-9 h-9 flex items-center justify-center text-white bg-gray-700 hover:bg-gray-600 rounded-lg transition border border-gray-600" title="Deshacer todos los cambios">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button onclick="closeEraseModal()" class="px-3 py-1.5 text-white bg-gray-600 hover:bg-gray-500 rounded-lg transition font-medium text-sm">
                    Cancelar
                </button>
                <button onclick="applyImageEdit()" class="px-4 py-1.5 text-white bg-blue-500 hover:bg-blue-600 shadow-lg rounded-lg transition font-bold flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-check"></i> Listo
                </button>
            </div>
        </div>

        <div class="flex-1 w-full flex items-center justify-center p-4 sm:p-8 overflow-auto relative">
            <canvas id="erase-canvas" class="rounded"></canvas>
            <canvas id="original-canvas" class="hidden"></canvas> 
        </div>
    </div>

    <script>
        fabric.Object.prototype.set({
            transparentCorners: false, cornerColor: '#3b82f6', cornerStrokeColor: '#ffffff',
            borderColor: '#3b82f6', cornerSize: 16, padding: 8, rotatingPointOffset: 40 
        });

        const canvas = new fabric.Canvas('c', { isDrawingMode: false, preserveObjectStacking: true, backgroundColor: '#ffffff' });
        const isMobile = window.innerWidth < 1000;
        const initialWidth = isMobile ? window.innerWidth - 90 : document.getElementById('canvas-width').value;
        const initialHeight = isMobile ? window.innerHeight - 90 : document.getElementById('canvas-height').value;
        canvas.setWidth(initialWidth);
        canvas.setHeight(initialHeight);

        let currentTool = 'select';
        let clipboard = null; 
        canvas.freeDrawingBrush.color = document.getElementById('brush-color').value;
        canvas.freeDrawingBrush.width = parseInt(document.getElementById('brush-size').value, 10);

        let undoStack = []; let redoStack = []; let isHistoryTracking = false;

        function updateUndoRedoUI() {
            document.getElementById('btn-undo').disabled = undoStack.length === 0;
            document.getElementById('btn-redo').disabled = redoStack.length === 0;
        }

        function saveHistory() {
            if (!isHistoryTracking) return;
            if (undoStack.length > 40) undoStack.shift();
            undoStack.push(JSON.stringify(canvas.toJSON()));
            redoStack = []; updateUndoRedoUI();
        }

        function undo() {
            if (undoStack.length === 0) return;
            isHistoryTracking = false;
            redoStack.push(JSON.stringify(canvas.toJSON()));
            canvas.loadFromJSON(undoStack.pop(), function() { canvas.renderAll(); isHistoryTracking = true; updateUndoRedoUI(); hideFloatingToolbar(); });
        }

        function redo() {
            if (redoStack.length === 0) return;
            isHistoryTracking = false;
            undoStack.push(JSON.stringify(canvas.toJSON()));
            canvas.loadFromJSON(redoStack.pop(), function() { canvas.renderAll(); isHistoryTracking = true; updateUndoRedoUI(); hideFloatingToolbar(); });
        }

        setTimeout(() => { isHistoryTracking = true; saveHistory(); }, 100);
        canvas.on('object:modified', saveHistory); canvas.on('object:added', saveHistory); canvas.on('object:removed', saveHistory);

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tool).classList.add('active');
            
            const drawOptions = document.getElementById('drawing-options');

            if (tool === 'draw') {
                canvas.isDrawingMode = true; drawOptions.classList.remove('opacity-50', 'pointer-events-none');
                canvas.defaultCursor = 'crosshair'; hideFloatingToolbar(); canvas.discardActiveObject(); canvas.requestRenderAll();
            } else {
                canvas.isDrawingMode = false; drawOptions.classList.add('opacity-50', 'pointer-events-none');
                if (tool === 'eraser') {
                    canvas.defaultCursor = 'url(https://cdn-icons-png.flaticon.com/32/1888/1888126.png) 0 32, auto';
                    hideFloatingToolbar(); canvas.discardActiveObject();
                } else if (tool === 'bucket') {
                    canvas.defaultCursor = 'url(https://cdn-icons-png.flaticon.com/32/3031/3031267.png) 0 32, pointer';
                    hideFloatingToolbar(); canvas.discardActiveObject();
                } else { canvas.defaultCursor = 'default'; }
            }
        }

        function updateBrush() {
            const color = document.getElementById('brush-color').value;
            const size = parseInt(document.getElementById('brush-size').value, 10);
            canvas.freeDrawingBrush.color = color; canvas.freeDrawingBrush.width = size;
            document.getElementById('brush-size-label').innerText = size + 'px';
        }

        canvas.on('mouse:down', function(options) {
            if (currentTool === 'eraser' && options.target) { canvas.remove(options.target); canvas.discardActiveObject(); } 
            else if (currentTool === 'bucket' && !options.target) {
                const color = document.getElementById('brush-color').value;
                canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas)); saveHistory();
            }
        });

        canvas.on('selection:created', updateFloatingToolbarPosition);
        canvas.on('selection:updated', updateFloatingToolbarPosition);
        canvas.on('object:moving', hideFloatingToolbar);
        canvas.on('object:scaling', hideFloatingToolbar);
        canvas.on('object:rotating', hideFloatingToolbar);
        canvas.on('selection:cleared', hideFloatingToolbar);
        canvas.on('mouse:up', function() { if (currentTool === 'select' && canvas.getActiveObject()) updateFloatingToolbarPosition(); });

        function updateFloatingToolbarPosition() {
            if (currentTool !== 'select') return;
            const activeObject = canvas.getActiveObject();
            if (!activeObject) return;

            const toolbar = document.getElementById('floating-toolbar');
            const cropBtn = document.getElementById('floating-crop-btn');
            const editBtn = document.getElementById('floating-edit-btn');
            const separators = document.getElementById('floating-img-separators');
            
            if (activeObject.type === 'image') { 
                cropBtn.style.display = 'flex'; editBtn.style.display = 'flex'; separators.style.display = 'block';
            } else { 
                cropBtn.style.display = 'none'; editBtn.style.display = 'none'; separators.style.display = 'none';
            }

            const bound = activeObject.getBoundingRect();
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const canvasContainer = document.querySelector('.canvas-container');
            
            const absoluteLeft = canvasContainer.offsetLeft + bound.left + (bound.width / 2) - (toolbar.offsetWidth / 2) - canvasWrapper.scrollLeft;
            const absoluteTop = canvasContainer.offsetTop + bound.top + bound.height + 25 - canvasWrapper.scrollTop;

            toolbar.style.left = `${Math.max(10, absoluteLeft)}px`; toolbar.style.top = `${Math.max(10, absoluteTop)}px`;
            toolbar.style.display = 'flex';
        }

        function hideFloatingToolbar() { document.getElementById('floating-toolbar').style.display = 'none'; }

        function deleteSelected() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject(); activeObjects.forEach(obj => canvas.remove(obj));
                hideFloatingToolbar(); saveHistory();
            }
        }
        
        function rotateSelected() {
            const obj = canvas.getActiveObject();
            if (obj) {
                let currentAngle = obj.angle || 0;
                obj.set('angle', currentAngle + 90);
                canvas.requestRenderAll();
                saveHistory();
                updateFloatingToolbarPosition();
            }
        }

        function flipSelected() {
            const obj = canvas.getActiveObject();
            if (obj) {
                obj.set('flipX', !obj.flipX);
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        let eraseModal = document.getElementById('erase-modal');
        let eraseCanvas = document.getElementById('erase-canvas');
        let eraseCtx = eraseCanvas.getContext('2d', { willReadFrequently: true });
        
        let origCanvas = document.getElementById('original-canvas');
        let origCtx = origCanvas.getContext('2d');

        let currentEraseObject = null;
        let eraseMode = 'manual';
        let isEditing = false;
        
        let smartTargetColor = null;
        let cropStart = {x: 0, y: 0}; let cropEnd = {x: 0, y: 0};
        let totalCropX = 0; let totalCropY = 0;

        function setEraseMode(mode) {
            eraseMode = mode;
            document.querySelectorAll('.modal-tool').forEach(btn => {
                btn.classList.remove('bg-blue-500', 'text-white', 'bg-emerald-600');
                btn.classList.add('text-gray-400');
            });
            let activeBtn = document.getElementById('tool-' + mode);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                if(mode === 'restore') activeBtn.classList.add('bg-emerald-600', 'text-white');
                else activeBtn.classList.add('bg-blue-500', 'text-white');
            }
            
            document.getElementById('erase-options-brush').style.display = ['manual', 'smart', 'restore'].includes(mode) ? 'flex' : 'none';
            document.getElementById('erase-options-tolerance').style.display = ['smart'].includes(mode) ? 'flex' : 'none';
            document.getElementById('erase-options-crop').style.display = (mode === 'crop') ? 'flex' : 'none';
            
            if(mode === 'crop') eraseCanvas.style.cursor = 'crosshair';
            else eraseCanvas.style.cursor = 'url(https://cdn-icons-png.flaticon.com/32/1888/1888126.png) 0 32, crosshair';
            
            resetEraseCanvas(); 
        }

        function openEraseModal(initialMode) {
            const activeObject = canvas.getActiveObject();
            if (!activeObject || activeObject.type !== 'image') return;
            
            currentEraseObject = activeObject; hideFloatingToolbar(); totalCropX = 0; totalCropY = 0;
            const imgElement = activeObject.getElement();
            const w = imgElement.naturalWidth || imgElement.width;
            const h = imgElement.naturalHeight || imgElement.height;
            
            eraseCanvas.width = origCanvas.width = w; eraseCanvas.height = origCanvas.height = h;
            origCtx.clearRect(0,0,w,h); origCtx.drawImage(imgElement, 0, 0, w, h);
            
            setEraseMode(initialMode);
            eraseModal.classList.remove('hidden'); eraseModal.classList.add('flex');
        }

        function resetEraseCanvas() {
            eraseCtx.globalCompositeOperation = 'source-over';
            eraseCtx.clearRect(0, 0, eraseCanvas.width, eraseCanvas.height);
            eraseCtx.drawImage(origCanvas, 0, 0); 
        }

        async function applyAI() {
            if(!currentEraseObject) return;
            const loader = document.getElementById('ai-loading');
            loader.style.display = 'flex'; 
            
            try {
                // IMPORTACIÓN DINÁMICA DE LA IA
                const imglyModule = await import('https://unpkg.com/@imgly/background-removal@1.4.3/dist/browser/bundle.mjs');
                const removeBackground = imglyModule.default;

                const dataUrl = eraseCanvas.toDataURL('image/png');
                const config = { publicPath: "https://unpkg.com/@imgly/background-removal@1.4.3/dist/assets/" };
                
                const blob = await removeBackground(dataUrl, config);
                
                const url = URL.createObjectURL(blob);
                const newImg = new Image();
                newImg.onload = () => {
                    origCtx.clearRect(0, 0, origCanvas.width, origCanvas.height);
                    origCtx.drawImage(newImg, 0, 0);
                    resetEraseCanvas(); 
                    loader.style.display = 'none'; 
                };
                newImg.src = url;
                
            } catch (error) {
                console.error(error);
                alert("Hubo un error de conexión al cargar la IA. Revisa tu internet.");
                loader.style.display = 'none';
            }
        }

        function redrawEraseCanvas() {
            if(eraseMode === 'crop' && isEditing) {
                eraseCtx.globalCompositeOperation = 'source-over';
                eraseCtx.clearRect(0, 0, eraseCanvas.width, eraseCanvas.height);
                eraseCtx.drawImage(origCanvas, 0, 0); 
                
                eraseCtx.fillStyle = "rgba(0, 0, 0, 0.5)";
                eraseCtx.fillRect(0, 0, eraseCanvas.width, eraseCanvas.height);
                
                let x = Math.min(cropStart.x, cropEnd.x); let y = Math.min(cropStart.y, cropEnd.y);
                let w = Math.abs(cropStart.x - cropEnd.x); let h = Math.abs(cropStart.y - cropEnd.y);
                
                eraseCtx.clearRect(x, y, w, h); eraseCtx.drawImage(origCanvas, x, y, w, h, x, y, w, h); 
                eraseCtx.strokeStyle = "#3b82f6"; eraseCtx.lineWidth = 2; eraseCtx.setLineDash([5, 5]);
                eraseCtx.strokeRect(x, y, w, h); eraseCtx.setLineDash([]);
            }
        }

        function handleEraseInteraction(e) {
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const rect = eraseCanvas.getBoundingClientRect();
            const scaleX = eraseCanvas.width / rect.width, scaleY = eraseCanvas.height / rect.height;
            const x = (touch.clientX - rect.left) * scaleX, y = (touch.clientY - rect.top) * scaleY;

            if (e.type === 'mousedown' || e.type === 'touchstart') {
                isEditing = true;
                if (eraseMode === 'smart') {
                    const pixel = eraseCtx.getImageData(x, y, 1, 1).data;
                    if(pixel[3] > 0) smartTargetColor = {r: pixel[0], g: pixel[1], b: pixel[2]}; else smartTargetColor = null;
                    applySmartBrush(x, y);
                } else if (eraseMode === 'crop') { cropStart = {x, y}; cropEnd = {x, y}; } 
                else { applyBrush(x, y, eraseMode); }
            } else if ((e.type === 'mousemove' || e.type === 'touchmove') && isEditing) {
                if (eraseMode === 'manual' || eraseMode === 'restore') applyBrush(x, y, eraseMode);
                else if (eraseMode === 'smart') applySmartBrush(x, y);
                else if (eraseMode === 'crop') { cropEnd = {x, y}; redrawEraseCanvas(); }
            } else if (e.type === 'mouseup' || e.type === 'touchend') {
                if(isEditing && eraseMode === 'crop') executeCrop();
                isEditing = false;
            }
        }

        eraseCanvas.addEventListener('mousedown', handleEraseInteraction); eraseCanvas.addEventListener('mousemove', handleEraseInteraction);
        eraseCanvas.addEventListener('mouseup', handleEraseInteraction); eraseCanvas.addEventListener('mouseout', () => { isEditing = false; });
        eraseCanvas.addEventListener('touchstart', handleEraseInteraction, {passive: false}); eraseCanvas.addEventListener('touchmove', handleEraseInteraction, {passive: false});
        eraseCanvas.addEventListener('touchend', handleEraseInteraction);

        function applyBrush(x, y, mode) {
            const size = parseInt(document.getElementById('erase-brush-size').value, 10);
            if (mode === 'manual') {
                eraseCtx.globalCompositeOperation = 'destination-out';
                eraseCtx.beginPath(); eraseCtx.arc(x, y, size, 0, Math.PI * 2); eraseCtx.fill();
            } else if (mode === 'restore') {
                eraseCtx.globalCompositeOperation = 'source-over'; eraseCtx.save();
                eraseCtx.beginPath(); eraseCtx.arc(x, y, size, 0, Math.PI * 2); eraseCtx.clip();
                eraseCtx.drawImage(origCanvas, 0, 0); eraseCtx.restore();
            }
        }

        function applySmartBrush(x, y) {
            if (!smartTargetColor) return;
            const r = parseInt(document.getElementById('erase-brush-size').value, 10);
            const tol = parseInt(document.getElementById('erase-tolerance').value, 10);
            
            const boxX = Math.floor(Math.max(0, x - r)), boxY = Math.floor(Math.max(0, y - r));
            const boxW = Math.min(eraseCanvas.width - boxX, r * 2), boxH = Math.min(eraseCanvas.height - boxY, r * 2);
            if(boxW <= 0 || boxH <= 0) return;
            
            const imgData = eraseCtx.getImageData(boxX, boxY, boxW, boxH); const data = imgData.data;
            for (let j = 0; j < boxH; j++) {
                for (let i = 0; i < boxW; i++) {
                    const cx = boxX + i, cy = boxY + j; const dx = cx - x, dy = cy - y;
                    if (dx*dx + dy*dy <= r*r) {
                        const idx = (j * boxW + i) * 4;
                        if (data[idx+3] === 0) continue;
                        const dist = Math.sqrt(Math.pow(data[idx]-smartTargetColor.r, 2) + Math.pow(data[idx+1]-smartTargetColor.g, 2) + Math.pow(data[idx+2]-smartTargetColor.b, 2));
                        if (dist <= tol) data[idx+3] = 0; 
                    }
                }
            }
            eraseCtx.putImageData(imgData, boxX, boxY);
        }

        function executeCrop() {
            let cx = Math.min(cropStart.x, cropEnd.x), cy = Math.min(cropStart.y, cropEnd.y);
            let cw = Math.abs(cropStart.x - cropEnd.x), ch = Math.abs(cropStart.y - cropEnd.y);
            
            if (cw < 10 || ch < 10) { resetEraseCanvas(); return; } 
            
            let tempCanvas = document.createElement('canvas'); tempCanvas.width = cw; tempCanvas.height = ch;
            tempCanvas.getContext('2d').drawImage(origCanvas, cx, cy, cw, ch, 0, 0, cw, ch);
            
            eraseCanvas.width = origCanvas.width = cw; eraseCanvas.height = origCanvas.height = ch;
            origCtx.clearRect(0,0,cw,ch); origCtx.drawImage(tempCanvas, 0, 0);
            eraseCtx.clearRect(0,0,cw,ch); eraseCtx.drawImage(tempCanvas, 0, 0);
            
            totalCropX += cx; totalCropY += cy;
        }

        function closeEraseModal() { eraseModal.classList.add('hidden'); eraseModal.classList.remove('flex'); currentEraseObject = null; }

        function applyImageEdit() {
            const dataURL = eraseCanvas.toDataURL('image/png');
            fabric.Image.fromURL(dataURL, function(img) {
                const rad = fabric.util.degreesToRadians(currentEraseObject.angle);
                const deltaX = totalCropX * currentEraseObject.scaleX, deltaY = totalCropY * currentEraseObject.scaleY;
                const finalX = deltaX * Math.cos(rad) - deltaY * Math.sin(rad), finalY = deltaX * Math.sin(rad) + deltaY * Math.cos(rad);

                img.set({
                    left: currentEraseObject.left + finalX, top: currentEraseObject.top + finalY,
                    scaleX: currentEraseObject.scaleX, scaleY: currentEraseObject.scaleY, angle: currentEraseObject.angle, flipX: currentEraseObject.flipX,
                    originX: 'left', originY: 'top', 
                    transparentCorners: false, cornerColor: '#3b82f6', cornerStrokeColor: '#ffffff', borderColor: '#3b82f6', cornerSize: 16, rotatingPointOffset: 40
                });
                
                isHistoryTracking = false; canvas.remove(currentEraseObject); canvas.add(img);
                canvas.setActiveObject(img); canvas.requestRenderAll(); isHistoryTracking = true; saveHistory(); closeEraseModal();
            });
        }

        async function pasteFromClipboard() {
            try {
                const clipboardItems = await navigator.clipboard.read();
                for (const clipboardItem of clipboardItems) {
                    for (const type of clipboardItem.types) {
                        if (type.startsWith('image/')) {
                            const blob = await clipboardItem.getType(type);
                            const reader = new FileReader();
                            reader.onload = function(event) {
                                const imgObj = new Image(); imgObj.src = event.target.result;
                                imgObj.onload = function() {
                                    const img = new fabric.Image(imgObj); if(img.width > 500) img.scaleToWidth(500); 
                                    img.set({ left: canvas.width/2 - img.getScaledWidth()/2, top: canvas.height/2 - img.getScaledHeight()/2, originX: 'left', originY: 'top', transparentCorners: false, cornerColor: '#3b82f6', cornerStrokeColor: '#ffffff', borderColor: '#3b82f6', cornerSize: 16, rotatingPointOffset: 40 });
                                    canvas.add(img); setTool('select'); canvas.setActiveObject(img); saveHistory();
                                }
                            }; reader.readAsDataURL(blob); return;
                        }
                    }
                }
            } catch (err) { console.warn('Bloqueado o no hay imagen. Intenta usar Ctrl+V.', err); }
        }

        function addSticker(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    if (img.width > 400) img.scaleToWidth(400);
                    img.set({ left: canvas.width/2 - img.getScaledWidth()/2, top: canvas.height/2 - img.getScaledHeight()/2, originX: 'left', originY: 'top', transparentCorners: false, cornerColor: '#3b82f6', cornerStrokeColor: '#ffffff', borderColor: '#3b82f6', cornerSize: 16, rotatingPointOffset: 40 });
                    canvas.add(img); setTool('select'); canvas.setActiveObject(img); saveHistory();
                });
            }; reader.readAsDataURL(file); event.target.value = ''; 
        }

        function setBackground(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    const scaleFactor = (canvas.width/canvas.height >= img.width/img.height) ? (canvas.width/img.width) : (canvas.height/img.height);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: scaleFactor, scaleY: scaleFactor, originX: 'center', originY: 'center', left: canvas.width/2, top: canvas.height/2 });
                    saveHistory();
                });
            }; reader.readAsDataURL(file); event.target.value = '';
        }

        document.addEventListener('paste', function(e) {
            if (e.target.tagName === 'INPUT') return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                if (items[index].kind === 'file') {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const imgObj = new Image(); imgObj.src = event.target.result;
                        imgObj.onload = function() {
                            const img = new fabric.Image(imgObj); if(img.width > 500) img.scaleToWidth(500); 
                            img.set({ left: canvas.width/2 - img.getScaledWidth()/2, top: canvas.height/2 - img.getScaledHeight()/2, originX: 'left', originY: 'top', transparentCorners: false, cornerColor: '#3b82f6', cornerStrokeColor: '#ffffff', borderColor: '#3b82f6', cornerSize: 16, rotatingPointOffset: 40 });
                            canvas.add(img); setTool('select'); canvas.setActiveObject(img); saveHistory();
                        }
                    }; reader.readAsDataURL(items[index].getAsFile());
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || !document.getElementById('erase-modal').classList.contains('hidden')) return;
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
            if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
            
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
                const activeObject = canvas.getActiveObject(); if (activeObject) activeObject.clone(function(cloned) { clipboard = cloned; });
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && clipboard) {
                clipboard.clone(function(clonedObj) {
                    canvas.discardActiveObject(); clonedObj.set({ left: clonedObj.left + 20, top: clonedObj.top + 20, evented: true });
                    if (clonedObj.type === 'activeSelection') { clonedObj.canvas = canvas; clonedObj.forEachObject(obj => canvas.add(obj)); clonedObj.setCoords(); } else canvas.add(clonedObj);
                    clipboard.top += 20; clipboard.left += 20; setTool('select'); canvas.setActiveObject(clonedObj); canvas.requestRenderAll(); saveHistory();
                });
            }
            if (e.key.toLowerCase() === 'v') setTool('select'); if (e.key.toLowerCase() === 'p') setTool('draw'); if (e.key.toLowerCase() === 'b') setTool('bucket');
        });

        function resizeCanvas() {
            const w = parseInt(document.getElementById('canvas-width').value, 10), h = parseInt(document.getElementById('canvas-height').value, 10);
            if (w > 0 && h > 0) {
                isHistoryTracking = false; canvas.setWidth(w); canvas.setHeight(h);
                if (canvas.backgroundImage) {
                    const img = canvas.backgroundImage; const scaleFactor = (w/h >= img.width/img.height) ? w/img.width : h/img.height;
                    img.set({ scaleX: scaleFactor, scaleY: scaleFactor, left: w/2, top: h/2 });
                }
                canvas.renderAll(); hideFloatingToolbar(); isHistoryTracking = true; saveHistory();
            }
        }

        function clearCanvas() {
            if(confirm('¿Estás seguro de que quieres borrar toda la pizarra?')) {
                canvas.clear(); canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas)); hideFloatingToolbar(); saveHistory();
            }
        }

        function exportImage() {
            canvas.discardActiveObject(); canvas.renderAll(); hideFloatingToolbar();
            const link = document.createElement('a'); link.download = 'Mi-Pizarra.png'; link.href = canvas.toDataURL({ format: 'png', quality: 1.0 });
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function saveProject() {
            const link = document.createElement('a'); link.download = 'Proyecto-Pizarra.json'; link.href = URL.createObjectURL(new Blob([JSON.stringify(canvas.toJSON())], { type: "application/json" }));
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function loadProject(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                isHistoryTracking = false; canvas.loadFromJSON(f.target.result, function() { canvas.renderAll(); isHistoryTracking = true; undoStack = []; redoStack = []; saveHistory(); });
            }; reader.readAsText(file); event.target.value = ''; 
        }
        updateUndoRedoUI();
    </script>
</body>
</html>
